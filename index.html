<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Diario giornaliero</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1d2326;--mut:#6b7479;--line:#e3e5e2;--acc:#0f766e;--yes:#15803d;--yesbg:#dcfce7;--no:#b42318;--nobg:#fee4e2;--bar:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#121516;--card:#1c2022;--ink:#eceeed;--mut:#98a2a6;--line:#2c3235;--acc:#2dd4bf;--yes:#4ade80;--yesbg:#133a22;--no:#f87171;--nobg:#451a1a;--bar:#2dd4bf}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav .d{font-weight:600;text-align:center;flex:1;text-transform:capitalize}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:18px}
.ib:disabled{opacity:.35}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--bar);transition:width .2s}
.q{padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qr{display:flex;align-items:center;gap:10px;justify-content:space-between}
.qt{flex:1;font-size:16px}
.tg{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.val{margin-top:8px;height:38px;padding:0 10px;font-size:14px}
.big{font-size:22px;font-weight:700}
.okbar{height:16px;background:var(--no);border-radius:10px;overflow:hidden;margin:10px 0 6px}
.okbar i{display:block;height:100%;background:var(--yes);border-radius:10px;transition:width .25s}
.okbar.sm2{height:8px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line)}
.chip.full{background:var(--yesbg);color:var(--yes)}
.chip.zero{background:var(--nobg);color:var(--no)}
.sec{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 2px;display:flex;justify-content:space-between}
.hs{font-weight:600;font-size:13px;margin:10px 0 4px;color:var(--mut)}
.hr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.hl{width:112px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.hc{flex:1;display:flex;gap:1px}
.hc i{flex:1;height:14px;border-radius:2px;background:var(--line)}
.hc i.g{background:var(--yes)}
.hc i.b{background:var(--no)}
.yn{display:flex;gap:6px}
.b{min-width:58px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--mut);font-size:16px;font-weight:600}
.b.y.on{background:var(--yesbg);border-color:var(--yes);color:var(--yes)}
.b.n.on{background:var(--nobg);border-color:var(--no);color:var(--no)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px;font:inherit}
textarea{min-height:84px;resize:vertical}
label.up{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mut);font-weight:600}
.photo{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.btn{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.btn.p{color:#08201d}}
.row{display:flex;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px}
.tabs button.on{color:var(--acc)}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.hist .ph{width:44px;height:44px;border-radius:8px;background:var(--line)}
.hist .m{flex:1;min-width:0}
.pill{font-weight:700;font-size:14px;padding:3px 9px;border-radius:99px;background:var(--line)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stat{padding:10px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar)}
.chart{display:flex;align-items:flex-end;gap:2px;height:90px}
.chart i{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.chart i.e{background:var(--line)}
.set{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set input[type=text]{flex:1}
.sm{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.sm.on{background:var(--yesbg);border-color:var(--yes);color:var(--yes)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;max-width:90%}
.hide{display:none}

/* compatto: una schermata su iPhone */
#app{padding:8px 12px}
body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.nav{margin-bottom:6px}
.ib{width:36px;height:36px;font-size:16px}
.card{padding:8px 12px;margin-bottom:8px}
.big{font-size:17px}
.okbar{height:12px;margin:6px 0 2px}
.sec{margin:8px 0 0;font-size:11px}
.q{padding:3px 0}
.qt{font-size:14px;line-height:1.2}
.tg{display:inline;margin-left:6px;font-size:11px}
.b{min-width:52px;height:34px;font-size:15px;border-radius:10px}
.tabs button{padding:4px 0;font-size:11px}
.tabs button span{font-size:17px}
.pi{display:flex;gap:10px;padding:9px 0 9px 10px;border-bottom:1px solid var(--line);border-left:3px solid var(--line)}
.pi:last-child{border-bottom:0}
.pi .pt{width:86px;flex:none;font-weight:600;font-size:13px;color:var(--mut)}
.pi .pb{flex:1;font-size:15px;line-height:1.3}
.pi.k-fisso{border-left-color:var(--acc)}
.pi.k-impegno{border-left-color:#b45309}
.pi.k-turno{border-left-color:#475569}
.pi.k-libero{border-left-style:dashed;opacity:.75}
.key{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;min-height:90px}
.tabs button{font-size:10.5px}
</style>
</head>
<body>
<div id="app"><p class="mut">Caricamento…</p></div>
<nav class="tabs" id="tabs">
 <button data-tab="oggi"><span>✓</span>Diario</button>
 <button data-tab="domani"><span>☀</span>Domani</button>
 <button data-tab="storico"><span>☰</span>Storico</button>
 <button data-tab="analisi"><span>▤</span>Analisi</button>
 <button data-tab="domande"><span>⚙</span>Domande</button>
</nav>
<div id="toast" class="toast hide"></div>
<script>
const DEFAULTS=[
 {id:"sonno",text:"Dormito almeno 7 ore",pos:true,sec:"Mattina"},
 {id:"terapia",text:"Preso terapia / integrazione",pos:true,sec:"Mattina"},
 {id:"igiene",text:"Igiene personale: doccia + routine mattino e sera",pos:true,sec:"Mattina"},
 {id:"cibo",text:"Mangiato seguendo le indicazioni di Scara",pos:true,sec:"Salute"},
 {id:"acqua",text:"Bevuto almeno 3 litri",pos:true,sec:"Salute"},
 {id:"passi",text:"Almeno 7.000 passi",pos:true,sec:"Salute"},
 {id:"allenamento",text:"Allenamento di almeno 60 minuti",pos:true,sec:"Salute"},
 {id:"burocrazia",text:"Gestione burocrazie",pos:true,target:"≥ 15 min",sec:"Produttività"},
 {id:"tedesco",text:"Studiato tedesco",pos:true,target:"≥ 30 min",sec:"Produttività"},
 {id:"lettura",text:"Letto almeno 30 minuti",pos:true,target:"≥ 30 min",sec:"Sera"},
 {id:"pianificazione",text:"Pianificato la giornata di domani",pos:true,sec:"Sera"}
];
let db=null,assets=null,cfg=null,days={},cur=today(),tab="oggi",range=30,ready=false,loadTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return fmt(new Date())}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function shift(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function label(s){
  if(s===today())return"Oggi";if(s===shift(today(),-1))return"Ieri";
  return parse(s).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}
function Q(){return cfg&&cfg.length?cfg:DEFAULTS}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hide"),2600)}

/* ---- salvataggio sul telefono (localStorage) ---- */
const KEY="diario:";
function write(path,data){
  try{localStorage.setItem(KEY+path,JSON.stringify(data))}
  catch(e){toast("Impossibile salvare: memoria piena o bloccata")}
}
function loadAll(){
  try{
    const c=localStorage.getItem(KEY+"config/questions");
    cfg=c?JSON.parse(c).items:null;days={};
    const p=KEY+"days/";
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p))days[k.slice(p.length)]=JSON.parse(localStorage.getItem(k))}
  }catch(e){toast("Errore di lettura dei dati")}
}
function download(name,text,type){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function saveDay(date,patch){
  const d=Object.assign({answers:{},note:"",photo:null},days[date]||{},patch,{date,updated:new Date().toISOString()});
  days[date]=d;write("days/"+date,d);
}
function saveCfg(items){cfg=items;write("config/questions",{items})}
let noteT=null;const valT={};

/* ---- calcoli ---- */
function dayStats(d){
  const items=Q();let ans=0,good=0;
  for(const q of items){const v=d&&d.answers?d.answers[q.id]:undefined;if(typeof v==="boolean"){ans++;if(v===q.pos)good++}}
  return{ans,good,total:items.length,pct:ans?Math.round(good/items.length*100):null};
}
function sections(){
  const m=[];
  for(const q of Q()){const s=q.sec||"Altro";let g=m.find(x=>x.name===s);if(!g){g={name:s,items:[]};m.push(g)}g.items.push(q)}
  return m;
}
function secScore(d,items){let g=0;for(const q of items){const v=d&&d.answers?d.answers[q.id]:undefined;if(v===q.pos)g++}return g}
function rdates(n,off){const a=[];for(let i=n-1;i>=0;i--)a.push(shift(today(),-(i+off)));return a}
function secRate(items,dates){let g=0,c=0;for(const k of dates){const d=days[k];if(d&&dayStats(d).ans>0){c++;g+=secScore(d,items)}}return c?g/(c*items.length):null}
function dayNumber(date){
  const ks=Object.keys(days).filter(k=>dayStats(days[k]).ans>0).sort();
  const first=ks.length&&ks[0]<date?ks[0]:date;
  return Math.round((parse(date)-parse(first))/864e5)+1;
}
function rangeDates(n){const a=[];for(let i=n-1;i>=0;i--)a.push(shift(today(),-i));return a}

/* ---- viste ---- */
function renderOggi(){
  const d=days[cur]||{answers:{}};const st=dayStats(d);const items=Q();
  const isToday=cur>=today();
  let h=`<div class="nav"><button class="ib" data-act="prev">‹</button><div class="d">${esc(label(cur))}</div><button class="ib" data-act="next" ${isToday?"disabled":""}>›</button></div>`;
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><div class="big">Giorno ${dayNumber(cur)}</div><div class="big">${st.good}/${st.total}${st.pct==null?"":" · "+st.pct+"%"}</div></div><div class="okbar"><i style="width:${st.total?st.good/st.total*100:0}%"></i></div>`;
  for(const sec of sections()){
   for(const q of sec.items){
    const v=d.answers?d.answers[q.id]:undefined;
    h+=`<div class="q"><div class="qr"><div class="qt">${esc(q.text)}${q.target?`<span class="tg">${esc(q.target)}</span>`:""}</div><div class="yn"><button class="b y ${v===true?"on":""}" data-act="ans" data-q="${q.id}" data-v="1">Sì</button><button class="b n ${v===false?"on":""}" data-act="ans" data-q="${q.id}" data-v="0">No</button></div></div></div>`;
   }
  }
  h+="</div>";
  return h;
}
function renderStorico(){
  const keys=Object.keys(days).sort().reverse();
  if(!keys.length)return`<h1>Storico</h1><div class="card mut">Ancora nessun giorno registrato.</div>`;
  let h=`<h1>Storico</h1><div class="card">`;
  for(const k of keys){
    const d=days[k],st=dayStats(d);
    h+=`<div class="hist" data-act="open" data-d="${k}"><div class="m"><div style="font-weight:600;text-transform:capitalize">${esc(parse(k).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}))}</div><div class="okbar sm2"><i style="width:${st.total?st.good/st.total*100:0}%"></i></div></div><div class="pill">${st.pct==null?"–":st.pct+"%"}</div></div>`;
  }
  return h+"</div>";
}
function streak(q){
  let s=0,date=today();
  if(!(days[date]&&typeof days[date].answers[q.id]==="boolean"))date=shift(date,-1);
  while(days[date]&&typeof days[date].answers[q.id]==="boolean"&&days[date].answers[q.id]===q.pos){s++;date=shift(date,-1)}
  return s;
}
function goodRate(q,dates){
  let a=0,g=0;for(const k of dates){const v=days[k]&&days[k].answers?days[k].answers[q.id]:undefined;if(typeof v==="boolean"){a++;if(v===q.pos)g++}}
  return{a,g,r:a?g/a:null};
}
function renderAnalisi(){
  const dates=rangeDates(range);const items=Q();
  const logged=dates.filter(k=>days[k]&&dayStats(days[k]).ans>0);
  let h=`<h1>Analisi</h1><div class="seg">${[7,30,90].map(n=>`<button data-act="range" data-n="${n}" class="${range===n?"on":""}">${n} giorni</button>`).join("")}</div>`;
  if(!logged.length)return h+`<div class="card mut">Nessun dato in questo periodo.</div>`+renderExport();
  const scores=logged.map(k=>dayStats(days[k]).pct);
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="mut">Giorni registrati</div><div style="font-size:24px;font-weight:700">${logged.length}<span class="mut"> / ${range}</span></div></div><div style="text-align:right"><div class="mut">Punteggio medio</div><div style="font-size:24px;font-weight:700">${avg}%</div></div></div>`;
  h+=`<div class="chart" style="margin-top:12px">${dates.map(k=>{const st=days[k]?dayStats(days[k]):{pct:null};return st.pct==null?`<i class="e" title="${k}"></i>`:`<i title="${k}: ${st.pct}%" style="height:${Math.max(st.pct,3)}%"></i>`}).join("")}</div><div class="mut" style="margin-top:4px">Punteggio giornaliero (% risposte nel verso positivo)</div></div>`;
  const hd=rangeDates(Math.min(range,30));
  h+=`<div class="card"><div style="font-weight:600;margin-bottom:8px">Griglia giorni (ultimi ${hd.length})</div>`;
  for(const s of sections()){
    h+=`<div class="hs">${esc(s.name)}</div>`;
    for(const q of s.items){
      h+=`<div class="hr"><div class="hl">${esc(q.text)}</div><div class="hc">${hd.map(k=>{const v=days[k]&&days[k].answers?days[k].answers[q.id]:undefined;const c=typeof v!=="boolean"?"":(v===q.pos?"g":"b");return`<i class="${c}" title="${k}"></i>`}).join("")}</div></div>`;
    }
  }
  h+=`<div class="mut" style="margin-top:8px">Verde = fatto · rosso = non fatto · grigio = non compilato</div></div>`;
  h+=`<div class="card"><div style="font-weight:600;margin-bottom:4px">Per sezione</div>`;
  for(const s of sections()){
    const r=secRate(s.items,dates),p=secRate(s.items,rdates(range,range));
    const pv=r==null?null:Math.round(r*100);let tr="";
    if(r!=null&&p!=null){const dl=Math.round((r-p)*100);tr=dl===0?"= rispetto al periodo precedente":(dl>0?"▲ +":"▼ ")+dl+"% rispetto al periodo precedente"}
    h+=`<div class="stat"><div class="top"><div>${esc(s.name)}</div><div style="font-weight:700">${pv==null?"–":pv+"%"}</div></div><div class="bar"><i style="width:${pv||0}%"></i></div><div class="chart" style="height:34px;margin-top:8px">${dates.map(k=>{const d=days[k];return d&&dayStats(d).ans>0?`<i style="height:${Math.max(secScore(d,s.items)/s.items.length*100,6)}%"></i>`:`<i class="e"></i>`}).join("")}</div><div class="mut" style="margin-top:4px">${tr}</div></div>`;
  }
  h+="</div>";
  h+=`<div class="card"><div style="font-weight:600;margin-bottom:4px">Per abitudine</div>`;
  const last7=rangeDates(7),prev7=rangeDates(14).slice(0,7);
  for(const q of items){
    const g=goodRate(q,dates);const a=goodRate(q,last7),b=goodRate(q,prev7);
    let trend="";
    if(a.r!=null&&b.r!=null){const dl=Math.round((a.r-b.r)*100);trend=dl===0?"=":(dl>0?"▲ +":"▼ ")+dl+"%"}
    const pctv=g.r==null?null:Math.round(g.r*100);
    h+=`<div class="stat"><div class="top"><div>${esc(q.text)}${q.pos?"":` <span class="mut">(No = bene)</span>`}</div><div style="font-weight:700">${pctv==null?"–":pctv+"%"}</div></div><div class="bar"><i style="width:${pctv||0}%"></i></div><div class="mut" style="margin-top:4px">${g.g}/${g.a} giorni · serie attuale ${streak(q)}${trend?` · ultimi 7 gg ${trend} vs 7 prima`:""}</div></div>`;
  }
  h+="</div>";
  return h+renderExport();
}
function csv(){
  const items=Q();const esc2=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const head=["data",...items.map(q=>(q.sec?q.sec+" - ":"")+q.text),"punteggio_%"];
  const rows=Object.keys(days).sort().map(k=>{const d=days[k];return[k,...items.map(q=>{const v=d.answers?d.answers[q.id]:undefined;return typeof v==="boolean"?(v?"si":"no"):""}),dayStats(d).pct??""]});
  return[head,...rows].map(r=>r.map(esc2).join(",")).join("\n");
}
function renderExport(){
  return`<div class="card"><div style="font-weight:600;margin-bottom:6px">Esporta i dati</div><div class="mut" style="margin-bottom:8px">Per l'analisi: copia o scarica il CSV e mandalo a Claude.</div><div class="row"><button class="btn p" data-act="copycsv">Copia CSV</button><button class="btn" data-act="dlcsv">Scarica CSV</button></div><textarea id="csvbox" class="hide" readonly style="margin-top:8px"></textarea></div><div class="card"><div style="font-weight:600;margin-bottom:6px">Backup</div><div class="mut" style="margin-bottom:8px">I dati sono salvati solo su questo telefono. Scarica un backup ogni tanto: se cancelli i dati di Safari o cambi telefono, lo usi per ripristinarli. Il backup contiene anche la chiave dei piani: tienilo in un posto sicuro.</div><div class="row"><button class="btn" data-act="dlbackup">Scarica backup</button><label class="btn" style="display:inline-flex;align-items:center">Ripristina<input type="file" id="restore" accept=".json,application/json" class="hide"></label></div></div>`;
}
function renderDomande(){
  const items=Q();
  let h=`<h1>Domande</h1><div class="card mut" style="margin-bottom:12px">Modifica, riordina o aggiungi domande. Con ✓ la risposta «Sì» conta come positiva; senza, è «No» a contare bene (es. «Ho rimandato…»). Le risposte già date restano associate alla domanda.</div><div class="card">`;
  items.forEach((q,i)=>{
    h+=`<div class="set" style="flex-wrap:wrap"><input type="text" data-act="qtext" data-i="${i}" value="${esc(q.text)}"><button class="sm ${q.pos?"on":""}" data-act="qpos" data-i="${i}" title="Sì è positivo">✓</button><button class="sm" data-act="qup" data-i="${i}">↑</button><button class="sm" data-act="qdel" data-i="${i}">✕</button><input type="text" data-act="qtarget" data-i="${i}" value="${esc(q.target||"")}" placeholder="Obiettivo (es. 30-60 min)" style="flex:1;height:36px;font-size:14px"><input type="text" data-act="qsec" data-i="${i}" value="${esc(q.sec||"")}" placeholder="Sezione" style="flex:1;height:36px;font-size:14px"></div>`;
  });
  h+=`<div style="margin-top:12px"><button class="btn p" data-act="qadd">+ Aggiungi domanda</button></div></div>`;
  h+=renderListEdit("exit")+renderListEdit("night");
  return h;
}
function render(){
  if(!ready)return;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const ae=document.activeElement;
  if(ae&&(ae.id==="note"||ae.dataset&&["qtext","qtarget","qsec","xtext"].includes(ae.dataset.act)))return; // non interrompere la digitazione
  $("#app").innerHTML=(tab==="oggi"?renderOggi:tab==="domani"?renderPlan:tab==="storico"?renderStorico:tab==="analisi"?renderAnalisi:renderDomande)();
}
function forceRender(){const ae=document.activeElement;if(ae&&ae.blur)ae.blur();render()}

/* ---- eventi ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;forceRender();window.scrollTo(0,0);return}
  const a=t.dataset.act;
  if(a==="prev"){cur=shift(cur,-1);forceRender()}
  else if(a==="next"){if(cur<today()){cur=shift(cur,1);forceRender()}}
  else if(a==="ans"){
    const id=t.dataset.q,v=t.dataset.v==="1";
    const d=days[cur]||{answers:{}};const answers=Object.assign({},d.answers);
    if(answers[id]===v)delete answers[id];else answers[id]=v;
    saveDay(cur,{answers});forceRender();
  }
  else if(a==="open"){cur=t.dataset.d;tab="oggi";forceRender();window.scrollTo(0,0)}
  else if(a==="range"){range=Number(t.dataset.n);forceRender()}
  else if(a==="copycsv"){
    const text=csv();const box=$("#csvbox");box.value=text;
    navigator.clipboard.writeText(text).then(()=>toast("CSV copiato")).catch(()=>{box.classList.remove("hide");box.select();toast("Copia il testo manualmente")});
  }
  else if(a==="genkey"){genKey().then(()=>{planDates=null;forceRender()}).catch(()=>toast("Non riesco a creare la chiave su questo browser"))}
  else if(a==="copykey"){const box=$("#keybox");navigator.clipboard.writeText(pubKeyString()).then(()=>toast("Chiave copiata")).catch(()=>{if(box){box.select()}toast("Copia il testo manualmente")})}
  else if(a==="reloadplans"){plans={};planDates=null;planBusy=false;forceRender()}
  else if(a==="pprev"||a==="pnext"){const i=planDates.indexOf(planCur)+(a==="pnext"?1:-1);if(i>=0&&i<planDates.length){planCur=planDates[i];forceRender()}}
  else if(a==="dlcsv"){download("diario-"+today()+".csv",csv(),"text/csv");toast("CSV scaricato")}
  else if(a==="dlbackup"){download("diario-backup-"+today()+".json",JSON.stringify({version:1,config:Q(),days,plankey:localStorage.getItem(PKEY),exitlist:listItems("exit"),nightlist:listItems("night")}),"application/json");toast("Backup scaricato")}
  else if(a==="qpos"){const items=Q().map(q=>({...q}));items[+t.dataset.i].pos=!items[+t.dataset.i].pos;saveCfg(items);forceRender()}
  else if(a==="qup"){const i=+t.dataset.i;if(i>0){const items=Q().map(q=>({...q}));[items[i-1],items[i]]=[items[i],items[i-1]];saveCfg(items);forceRender()}}
  else if(a==="qdel"){const items=Q().filter((_,i)=>i!==+t.dataset.i);if(!items.length){toast("Serve almeno una domanda");return}saveCfg(items);forceRender()}
  else if(a==="xtick"){const k=t.dataset.k,d=listDone(k);if(d[t.dataset.id])delete d[t.dataset.id];else d[t.dataset.id]=true;write(LISTS[k].tick+today(),d);forceRender()}
  else if(a==="xup"){const k=t.dataset.k,i=+t.dataset.i;if(i>0){const it=listItems(k).map(x=>({...x}));[it[i-1],it[i]]=[it[i],it[i-1]];saveList(k,it);forceRender()}}
  else if(a==="xdel"){const k=t.dataset.k,it=listItems(k).filter((_,i)=>i!==+t.dataset.i);if(!it.length){toast("Serve almeno una voce");return}saveList(k,it);forceRender()}
  else if(a==="xadd"){const k=t.dataset.k,it=listItems(k).map(x=>({...x}));it.push({id:"x"+Date.now().toString(36),text:"Nuova voce"});saveList(k,it);forceRender()}
  else if(a==="qadd"){const items=Q().map(q=>({...q}));items.push({id:"q"+Date.now().toString(36),text:"Nuova domanda",pos:true});saveCfg(items);forceRender()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id!=="restore"||!t.files||!t.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||typeof o.days!=="object")throw new Error("formato");
      if(Array.isArray(o.config)&&o.config.length)saveCfg(o.config);
      if(Array.isArray(o.exitlist)&&o.exitlist.length)saveList("exit",o.exitlist);
      if(Array.isArray(o.nightlist)&&o.nightlist.length)saveList("night",o.nightlist);
      if(o.plankey&&typeof o.plankey==="string"){try{JSON.parse(o.plankey);localStorage.setItem(PKEY,o.plankey)}catch(e){}}
      for(const k of Object.keys(o.days)){days[k]=o.days[k];write("days/"+k,o.days[k])}
      toast("Backup ripristinato");forceRender();
    }catch(err){toast("File di backup non valido")}
  };
  r.readAsText(t.files[0]);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&["qtext","qtarget","qsec"].includes(t.dataset.act)){
    clearTimeout(noteT);const i=+t.dataset.i,val=t.value,field={qtext:"text",qtarget:"target",qsec:"sec"}[t.dataset.act];
    noteT=setTimeout(()=>{const items=Q().map(q=>({...q}));if(items[i]){items[i][field]=val;saveCfg(items)}},700);
  }
  else if(t.dataset&&t.dataset.act==="xtext"){
    clearTimeout(noteT);const i=+t.dataset.i,val=t.value;
    const k=t.dataset.k;noteT=setTimeout(()=>{const it=listItems(k).map(x=>({...x}));if(it[i]){it[i].text=val;saveList(k,it)}},700);
  }
  else if(t.dataset&&t.dataset.act==="val"){
    const id=t.dataset.q,date=cur,val=t.value;
    clearTimeout(valT[id]);
    valT[id]=setTimeout(()=>{const d=days[date]||{};saveDay(date,{vals:Object.assign({},d.vals,{[id]:val})})},700);
  }
});
/* ---- checklist ("prima di uscire", "prima di dormire"): liste fisse, spunte azzerate ogni giorno ---- */
const LISTS={
 exit:{title:"Prima di uscire",cfg:"config/exitlist",tick:"ticks/",def:[
  {id:"e1",text:"Luci spente"},
  {id:"e2",text:"Telefono"},
  {id:"e3",text:"Chiavi casa e lavoro"},
  {id:"e4",text:"Cibo per la giornata"},
  {id:"e5",text:"Borraccia"},
  {id:"e6",text:"Caffè"},
  {id:"e7",text:"Zaino con dentro: pochette Columbia, pochette Cotopaxi"},
  {id:"e8",text:"Porta chiusa"},
  {id:"e9",text:"Garage chiuso"},
  {id:"e10",text:"Check luci da fuori"}]},
 night:{title:"Prima di dormire",cfg:"config/nightlist",tick:"ticksn/",def:[
  {id:"n1",text:"Doppia sveglia impostata"},
  {id:"n2",text:"Telefono in carica"}]}
};
function listItems(k){
  try{const c=JSON.parse(localStorage.getItem(KEY+LISTS[k].cfg));if(c&&Array.isArray(c.items)&&c.items.length)return c.items}catch(e){}
  return LISTS[k].def;
}
function saveList(k,items){write(LISTS[k].cfg,{items})}
function listDone(k){try{return JSON.parse(localStorage.getItem(KEY+LISTS[k].tick+today()))||{}}catch(e){return{}}}
function renderList(k){
  const items=listItems(k),done=listDone(k);
  const n=items.filter(x=>done[x.id]).length;
  let h=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:4px"><div style="font-weight:600">${LISTS[k].title}</div><div class="mut">${n===items.length?"Tutto pronto ✓":n+"/"+items.length}</div></div>`;
  for(const x of items){
    const on=!!done[x.id];
    h+=`<div class="q" style="padding:2px 0"><div class="qr"><div class="qt" style="${on?"color:var(--mut);text-decoration:line-through":""}">${esc(x.text)}</div><div class="yn"><button class="b y ${on?"on":""}" data-act="xtick" data-k="${k}" data-id="${esc(x.id)}" style="min-width:52px;height:34px">${on?"✓":""}</button></div></div></div>`;
  }
  return h+`</div>`;
}
function renderListEdit(k){
  const items=listItems(k);
  let h=`<div class="card mut" style="margin:12px 0">Lista «${LISTS[k].title}»: appare in Domani. Le spunte si azzerano ogni giorno.</div><div class="card">`;
  items.forEach((x,i)=>{h+=`<div class="set"><input type="text" data-act="xtext" data-k="${k}" data-i="${i}" value="${esc(x.text)}"><button class="sm" data-act="xup" data-k="${k}" data-i="${i}">↑</button><button class="sm" data-act="xdel" data-k="${k}" data-i="${i}">✕</button></div>`});
  return h+`<div style="margin-top:12px"><button class="btn p" data-act="xadd" data-k="${k}">+ Aggiungi voce</button></div></div>`;
}
/* ---- piano di domani: file cifrati nel repository, chiave solo sul telefono ---- */
const PKEY="diario:plankey";
let planDates=null,plans={},planCur=null,planErr="",planBusy=false;
function b64d(x){const bin=atob(x),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function planKeys(){try{return JSON.parse(localStorage.getItem(PKEY))}catch(e){return null}}
async function genKey(){
  const kp=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
  const pub=await crypto.subtle.exportKey("jwk",kp.publicKey),prv=await crypto.subtle.exportKey("jwk",kp.privateKey);
  localStorage.setItem(PKEY,JSON.stringify({pub,prv}));
}
async function decryptPlan(o){
  const k=planKeys();if(!k)throw new Error("nokey");
  const prv=await crypto.subtle.importKey("jwk",k.prv,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},prv,b64d(o.k));
  const aes=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(o.iv)},aes,b64d(o.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadPlan(date){
  if(!date||plans[date])return;
  try{const r=await fetch("plans/"+date+".json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);plans[date]=await decryptPlan(await r.json())}
  catch(e){plans[date]={error:true}}
}
async function loadPlans(){
  if(planBusy)return;planBusy=true;planErr="";
  try{
    const r=await fetch("plans/index.json",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const ix=await r.json();planDates=(ix.dates||[]).slice().sort();
    if(!planCur||!planDates.includes(planCur)){
      const t=shift(today(),1);
      planCur=planDates.includes(t)?t:(planDates.filter(x=>x>=today())[0]||planDates[planDates.length-1]||null);
    }
    if(planKeys())await loadPlan(planCur);
  }catch(e){if(planDates===null)planDates=[];planErr=navigator.onLine?"Nessun piano trovato.":"Sei offline e non ho un piano salvato."}
  planBusy=false;if(tab==="domani")forceRender();
}
function pubKeyString(){const k=planKeys();return k&&k.pub?k.pub.n:""}
function renderPlan(){
  if(!planKeys()){
    return`<h1>Domani</h1><div class="card"><div style="font-weight:600;margin-bottom:6px">Prima configurazione</div><div class="mut" style="margin-bottom:10px">Il piano di domani arriva cifrato: solo questo telefono può leggerlo. Tocca il pulsante per creare la chiave, poi copia il testo e mandalo a Claude in chat.</div><button class="btn p" data-act="genkey">Crea la chiave</button></div>`;
  }
  if(planDates===null){if(!planBusy)loadPlans();return`<h1>Domani</h1><div class="card mut">Caricamento…</div>`+renderList("exit")+renderList("night")+renderKeyCard()}
  const date=planCur,pl=date?plans[date]:null;
  let h=`<div class="nav"><button class="ib" data-act="pprev" ${planDates.indexOf(date)<=0?"disabled":""}>‹</button><div class="d">${date?esc(label(date)):"Nessun piano"}</div><button class="ib" data-act="pnext" ${planDates.indexOf(date)>=planDates.length-1?"disabled":""}>›</button></div>`;
  if(!date){h+=`<div class="card mut">${esc(planErr||"Ancora nessun piano. La sera scrivi a Claude «pianifica domani».")}</div>`}
  else if(!pl){loadPlan(date).then(()=>{if(tab==="domani")forceRender()});h+=`<div class="card mut">Caricamento…</div>`}
  else if(pl.error){h+=`<div class="card mut">Non riesco a leggere questo piano. Se hai creato una nuova chiave dopo la sua pubblicazione, o hai cambiato telefono, chiedi a Claude di ripubblicarlo.</div>`}
  else{
    h+=`<div class="card">`;
    if(pl.title)h+=`<div style="font-weight:700;font-size:17px;margin-bottom:6px">${esc(pl.title)}</div>`;
    for(const it of pl.items||[]){
      const t=it.start?(it.end?it.start+" – "+it.end:it.start):"";
      h+=`<div class="pi k-${esc(it.kind||"fisso")}"><div class="pt">${esc(t)}</div><div class="pb">${esc(it.text)}</div></div>`;
    }
    h+=`</div>`;
  }
  return h+renderList("exit")+renderList("night")+renderKeyCard();
}
function renderKeyCard(){
  return`<div class="card"><div style="font-weight:600;margin-bottom:6px">Chiave del piano</div><div class="mut" style="margin-bottom:8px">Questa è la parte pubblica della chiave: serve a Claude per cifrare i piani. Non permette di leggerli.</div><textarea id="keybox" class="key" readonly>${esc(pubKeyString())}</textarea><div class="row" style="margin-top:8px"><button class="btn p" data-act="copykey">Copia chiave</button><button class="btn" data-act="reloadplans">Aggiorna piani</button></div></div>`;
}
/* ---- avvio ---- */
ready=true;loadAll();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
